name: Artifact snapshot request
description: Request access to paper artifacts that are intentionally excluded from Git.
title: "[Artifact request] "
labels:
  - artifact-request
body:
  - type: markdown
    attributes:
      value: |
        Large model outputs and derived indices are not committed to this repository.
        Complete this form so the authors can identify the requested snapshot and
        confirm whether redistribution is permitted.

  - type: checkboxes
    id: groups
    attributes:
      label: Artifact groups
      description: Select every group you need.
      options:
        - label: "`res` — model responses, token probabilities, and external popularity indices"
        - label: "`llm_pop_generation` — LLM-estimated popularity outputs"
        - label: "`self_consistency` — sampling and judge outputs"
        - label: "`verbalized_confidence` — verbalized-confidence outputs"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Paper version or commit
      description: Provide a paper version, tag, or Git commit hash.
      placeholder: "e.g. camera-ready-v1 or abc1234"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Intended use
      description: Briefly describe the reproduction or analysis you plan to run.
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Upstream terms
      options:
        - label: I understand that model weights and raw Wikipedia dumps must be obtained from their original providers.
          required: true

